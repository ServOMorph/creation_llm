<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Relecture A1 — échecs 369M</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1d1d1b;--mut:#6b6a63;--line:#dedcd3;--ok:#1f7a45;--warn:#a65a00;--ind:#4b5563;--rep:#fdf0d5}
@media(prefers-color-scheme:dark){:root{--bg:#161614;--card:#1f1f1c;--ink:#efede6;--mut:#a3a197;--line:#35342f;--ok:#4ac283;--warn:#f0a247;--ind:#aab2bf;--rep:#3a3120}}
*{box-sizing:border-box}
body{margin:0 auto;background:var(--bg);color:var(--ink);font:17px/1.45 system-ui,sans-serif;padding:12px;max-width:640px}
h1{font-size:18px;margin:4px 0 8px}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);width:0}
.stat{color:var(--mut);font-size:14px;margin:6px 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
.tag{font-size:13px;color:var(--mut)}
.lbl{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);margin:12px 0 3px}
.q{font-size:19px;font-weight:600}
.rep{background:var(--rep);border-radius:8px;padding:10px;white-space:pre-wrap;word-break:break-word}
.att{font-family:ui-monospace,monospace;font-size:14px;word-break:break-all;white-space:pre-wrap}
.who{font-size:12px;color:var(--mut);margin:8px 0 2px;font-weight:600}
.turn{border-left:3px solid var(--line);padding-left:10px;margin-top:6px}
.rep.old{background:transparent;border:1px dashed var(--line);color:var(--mut)}
.row{display:grid;gap:8px;margin-top:10px}
button{font:inherit;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:14px 10px;cursor:pointer;text-align:left}
button.sel{border-color:currentColor;font-weight:700}
.b-echec{color:var(--ok)} .b-strict{color:var(--warn)} .b-ind{color:var(--ind)}
.nav{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.nav button{text-align:center}
textarea,input[type=text]{width:100%;font:inherit;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
.small{font-size:14px;padding:8px 10px}
.pre{font-size:12px;color:var(--mut)}
.grid{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.grid[hidden]{display:none}
.dot{width:34px;height:34px;padding:0;text-align:center;font-size:12px;border-radius:8px}
.dot.cur{outline:3px solid var(--ink)}
.dot.e{background:var(--ok);color:#fff;border-color:var(--ok)}
.dot.s{background:var(--warn);color:#fff;border-color:var(--warn)}
.dot.i{background:var(--ind);color:#fff;border-color:var(--ind)}
.msg{color:var(--mut);font-size:14px;margin-top:6px}
</style>
</head>
<body>
<h1>Relecture A1 : échecs du 369M</h1>
<div class="bar"><i id="pb"></i></div>
<div class="stat" id="stat"></div>
<div class="card" id="card"></div>
<div class="nav"><button id="prev">&larr; Précédent</button><button id="next">Suivant &rarr;</button></div>
<div class="card" style="margin-top:10px">
<div class="lbl">Navigation</div>
<div class="nav"><button class="small" id="nextun">Prochain non jugé</button><button class="small" id="listtog">Liste des cas</button></div>
<div class="grid" id="grid" hidden></div>
</div>
<div class="card">
<div class="lbl">Résultats à me renvoyer</div>
<div class="nav"><button class="small" id="copy">Copier les résultats</button><button class="small" id="show">Afficher le texte</button></div>
<textarea id="out" rows="8" hidden readonly></textarea>
<div class="msg" id="cmsg">Copiez puis collez le texte dans la conversation Claude Code. Les choix sont aussi gardés dans ce navigateur (si disponible).</div>
</div>
<script>
const DATA=__DATA__;
const KEY='a1_relecture_v1';
const L={echec_reel:['Vrai échec','b-echec','e'],motif_trop_strict:['Motif trop strict (réponse acceptable)','b-strict','s'],indetermine:['Indéterminé','b-ind','i']};
let cur=0,store={};
try{store=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){store={}}
DATA.forEach(c=>{const k=c.id+'|'+c.seed;if(!(k in store)&&c.lab)store[k]={lab:c.lab,note:'',pre:true}});
function key(c){return c.id+'|'+c.seed}
function save(){try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}}
function esc(s){return String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function haut(){window.scrollTo(0,0)}
function jug(i){const s=store[key(DATA[i])];return !!(s&&s.lab)}
const VIEW=DATA.map((c,i)=>i).filter(i=>!jug(i));
function render(){
 if(!VIEW.length){document.getElementById('card').textContent='Aucun cas non jugé.';document.getElementById('stat').textContent='Tous les cas sont jugés.';updOut();return}
 const c=DATA[VIEW[cur]],s=store[key(c)]||{};
 const done=VIEW.filter(jug).length;
 document.getElementById('pb').style.width=(100*done/VIEW.length)+'%';
 document.getElementById('stat').textContent='Cas '+(cur+1)+' sur '+VIEW.length+' (non jugés au départ) · jugés : '+done+' · restants : '+(VIEW.length-done);
 let h='<div class="tag">'+esc(c.id)+' · graine '+c.seed+' · '+esc(c.cat)+(s.pre?' <span class="pre">(déjà jugé par téléphone)</span>':'')+'</div>';
 const n=c.dlg.length;
 h+='<div class="lbl">'+(n>1?'Dialogue complet ('+n+' tours) — jugez seulement la DERNIÈRE réponse':'Question posée au modèle')+'</div>';
 c.dlg.forEach((t,i)=>{
  const last=i===n-1;
  h+='<div class="turn"><div class="who">'+(n>1?'Tour '+(i+1)+' · ':'')+'Utilisateur</div><div class="q">'+esc(t.u)+'</div>';
  h+='<div class="who">Modèle'+(last?' — RÉPONSE À JUGER':(n>1?' (réponse précédente, contexte)':''))+'</div><div class="'+(last?'rep':'rep old')+'">'+esc(t.m)+'</div></div>';
 });
 const att=[];
 if(c.ok.length)att.push('au moins un de : '+c.ok.join('  ||  '));
 if(c.okall.length)att.push('tous : '+c.okall.join('  &&  '));
 if(c.ko.length)att.push('interdit : '+c.ko.join('  ||  '));
 h+='<div class="lbl">Critère automatique (ce que le test attendait, sur la dernière réponse)</div><div class="att">'+esc(att.join('\n'))+'</div>';
 h+='<div class="row">';
 Object.keys(L).forEach(k=>{h+='<button data-l="'+k+'" class="'+L[k][1]+(s.lab===k?' sel':'')+'">'+(s.lab===k?'&#10003; ':'')+L[k][0]+'</button>'});
 h+='</div><div class="lbl">Remarque (facultatif)</div><input type="text" id="note" value="'+esc(s.note||'')+'" placeholder="ex : contexte manquant">';
 document.getElementById('card').innerHTML=h;
 document.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{const k=key(c);store[k]={lab:b.dataset.l,note:(store[k]||{}).note||'',pre:false};save();if(cur<VIEW.length-1)cur++;render();haut()});
 document.getElementById('note').onchange=e=>{const k=key(c);store[k]=Object.assign({lab:'',pre:false},store[k],{note:e.target.value});save();updOut()};
 renderGrid();updOut();
}
function renderGrid(){
 const g=document.getElementById('grid');
 g.innerHTML=VIEW.map((di,i)=>{const s=store[key(DATA[di])];const cl=s&&s.lab?L[s.lab][2]:'';return '<button class="dot '+cl+(i===cur?' cur':'')+'" data-i="'+i+'">'+(i+1)+'</button>'}).join('');
 g.querySelectorAll('.dot').forEach(b=>b.onclick=()=>{cur=+b.dataset.i;render();haut()});
}
function text(){
 const n={echec_reel:0,motif_trop_strict:0,indetermine:0,non_juge:0};
 const lines=DATA.map(c=>{const s=store[key(c)]||{};const l=s.lab||'non_juge';n[l]++;return c.id+'/'+c.seed+' : '+l+(s.note?' ('+s.note.replace(/\s+/g,' ')+')':'')});
 return 'RELECTURE A1 — '+DATA.length+' cas\nBilan : vrais échecs '+n.echec_reel+', motif trop strict '+n.motif_trop_strict+', indéterminé '+n.indetermine+', non jugé '+n.non_juge+'\n'+lines.join('\n');
}
function updOut(){document.getElementById('out').value=text()}
document.getElementById('prev').onclick=()=>{if(cur>0){cur--;render();haut()}};
document.getElementById('next').onclick=()=>{if(cur<VIEW.length-1){cur++;render();haut()}};
document.getElementById('nextun').onclick=()=>{for(let k=1;k<=VIEW.length;k++){const i=(cur+k)%VIEW.length;if(!jug(VIEW[i])){cur=i;render();haut();return}}document.getElementById('cmsg').textContent='Tous les cas sont jugés.'};
document.getElementById('listtog').onclick=()=>{const g=document.getElementById('grid');g.hidden=!g.hidden};
document.getElementById('show').onclick=()=>{const o=document.getElementById('out');o.hidden=!o.hidden;updOut()};
document.getElementById('copy').onclick=async()=>{updOut();const o=document.getElementById('out');try{await navigator.clipboard.writeText(o.value);document.getElementById('cmsg').textContent='Copié. Collez-le dans la conversation.'}catch(e){o.hidden=false;o.select();document.getElementById('cmsg').textContent='Copie refusée : le texte est affiché, sélectionnez-le et copiez-le à la main.'}};
render();
</script>
</body>
</html>
