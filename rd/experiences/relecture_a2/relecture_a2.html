const KEY='a2_relecture_v1';
const L={ok:['Famille correcte (aucun défaut)','b-echec','e'],defaut:['Défaut ou contradiction','b-strict','s'],indetermine:['Indéterminé','b-ind','i']};
const VN={gold:'Variante 1 : avec preuve (la réponse attendue est la valeur du passage)',sans_preuve:'Variante 2 : sans preuve (le modèle doit refuser de répondre)',contrefactuel:'Variante 3 : preuve contrefactuelle (valeur différente de la variante 1)'};
let cur=0,store={};
try{store=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){store={}}
function key(c){return c.id}
function save(){try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}}
function esc(s){return String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function haut(){window.scrollTo(0,0)}
function jug(i){const s=store[key(DATA[i])];return !!(s&&s.lab)}
let VIEW=[];
function render(){
 if(!VIEW.length){document.getElementById('card').textContent='Aucune famille non jugée.';document.getElementById('stat').textContent='Toutes les familles sont jugées.';updOut();return}
 const c=DATA[VIEW[cur]],s=store[key(c)]||{};
 const done=VIEW.filter(jug).length;
 document.getElementById('pb').style.width=(100*done/VIEW.length)+'%';
 document.getElementById('stat').textContent='Famille '+(cur+1)+' sur '+VIEW.length+' (non jugées au départ) · jugées : '+done+' · restantes : '+(VIEW.length-done);
 let h='<div class="tag">'+esc(c.id)+' · gabarit '+esc(c.gab)+' · entité '+esc(c.ent)+' · valeur '+esc(c.val)+' · contrefactuelle '+esc(c.cf)+'</div><div class="msg">Signalée par le contrôle automatique : '+esc(c.flag)+'</div>';
 h+='<div class="lbl">À juger : les 3 exemples disent-ils le même fait, sans contradiction, avec une question à réponse unique ?</div>';
 c.vs.forEach((t,i)=>{
  h+='<div class="turn"><div class="who">'+esc(VN[t.v])+'</div><div class="att">'+esc(t.u)+'</div>';
  h+='<div class="who">Réponse attendue</div><div class="rep">'+esc(t.m)+'</div></div>';
 });
 h+='<div class="row">';
 Object.keys(L).forEach(k=>{h+='<button data-l="'+k+'" class="'+L[k][1]+(s.lab===k?' sel':'')+'">'+(s.lab===k?'&#10003; ':'')+L[k][0]+'</button>'});
 h+='</div><div class="lbl">Remarque (facultatif)</div><input type="text" id="note" value="'+esc(s.note||'')+'" placeholder="ex : valeur peu plausible">';
 document.getElementById('card').innerHTML=h;
 document.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{const k=key(c);store[k]={lab:b.dataset.l,note:(store[k]||{}).note||'',pre:false};save();pers(k);if(cur<VIEW.length-1)cur++;render();haut()});
 document.getElementById('note').onchange=e=>{const k=key(c);store[k]=Object.assign({lab:'',pre:false},store[k],{note:e.target.value});save();pers(k);updOut()};
 renderGrid();updOut();
}
function renderGrid(){
 const g=document.getElementById('grid');
 g.innerHTML=VIEW.map((di,i)=>{const s=store[key(DATA[di])];const cl=s&&s.lab?L[s.lab][2]:'';return '<button class="dot '+cl+(i===cur?' cur':'')+'" data-i="'+i+'">'+(i+1)+'</button>'}).join('');
 g.querySelectorAll('.dot').forEach(b=>b.onclick=()=>{cur=+b.dataset.i;render();haut()});
}
function text(){
 const n={ok:0,defaut:0,indetermine:0,non_juge:0};
 const lines=DATA.map(c=>{const s=store[key(c)]||{};const l=s.lab||'non_juge';n[l]++;return c.id+' : '+l+(s.note?' ('+s.note.replace(/\s+/g,' ')+')':'')});
 const NL=String.fromCharCode(10);
 return 'RELECTURE A2 — '+DATA.length+' familles'+NL+'Bilan : correctes '+n.ok+', défaut '+n.defaut+', indéterminé '+n.indetermine+', non jugé '+n.non_juge+NL+lines.join(NL);
}
function updOut(){document.getElementById('out').value=text()}
document.getElementById('prev').onclick=()=>{if(cur>0){cur--;render();haut()}};
document.getElementById('next').onclick=()=>{if(cur<VIEW.length-1){cur++;render();haut()}};
document.getElementById('nextun').onclick=()=>{for(let k=1;k<=VIEW.length;k++){const i=(cur+k)%VIEW.length;if(!jug(VIEW[i])){cur=i;render();haut();return}}document.getElementById('cmsg').textContent='Tous les cas sont jugés.'};
document.getElementById('listtog').onclick=()=>{const g=document.getElementById('grid');g.hidden=!g.hidden};
document.getElementById('show').onclick=()=>{const o=document.getElementById('out');o.hidden=!o.hidden;updOut()};
document.getElementById('copy').onclick=async()=>{updOut();const o=document.getElementById('out');try{await navigator.clipboard.writeText(o.value);document.getElementById('cmsg').textContent='Copié. Collez-le dans la conversation.'}catch(e){o.hidden=false;o.select();document.getElementById('cmsg').textContent='Copie refusée : le texte est affiché, sélectionnez-le et copiez-le à la main.'}};
let DB=null,chain=Promise.resolve();
function setStatus(m){document.getElementById('dbs').textContent=m}
function pers(k){
 if(!DB)return;
 const s=store[k];
 chain=chain.then(()=>DB.collection('a2').doc(k.replace('|','_')).set({lab:s.lab||'',note:s.note||'',pre:!!s.pre,t:Date.now()})).catch(()=>setStatus('Sauvegarde : écriture en base refusée, navigateur seulement'));
}
function timeout(ms){return new Promise((_,j)=>setTimeout(()=>j(new Error('delai')),ms))}
async function init(){
 document.getElementById('card').textContent='Chargement…';
 try{
  const db=await Promise.race([claude.use('db'),new Promise(r=>setTimeout(()=>r(null),10000))]);
  if(db){
   const snap=await Promise.race([db.collection('a2').get(),timeout(10000)]);
   const vus=new Set();
   snap.docs.forEach(d=>{const x=d.data();if(x&&x.lab){const k=d.id.replace('_','|');vus.add(k);store[k]={lab:x.lab,note:x.note||'',pre:!!x.pre}}});
   DB=db;save();
   Object.keys(store).forEach(k=>{if(store[k].lab&&!store[k].pre&&!vus.has(k))pers(k)});
   setStatus('Sauvegarde : base de données active ('+vus.size+' cas déjà enregistrés)');
  }else setStatus('Sauvegarde : navigateur seulement (base indisponible)');
 }catch(e){setStatus('Sauvegarde : navigateur seulement (base injoignable)')}
 VIEW=DATA.map((c,i)=>i).filter(i=>!jug(i));
 render();
}
init();
</script>
