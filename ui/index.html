<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>creation_llm — tableau de bord</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1d2330;--mute:#6b7280;--line:#e5e7eb;--a:#2563eb;--ok:#15803d;--warn:#b45309;--bad:#b91c1c;--b:#9333ea}
@media (prefers-color-scheme:dark){:root{--bg:#111418;--card:#1a1f26;--ink:#e6e9ef;--mute:#9aa3b2;--line:#2b323c;--a:#60a5fa;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171;--b:#c084fc}}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 system-ui,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}
header{display:flex;gap:16px;align-items:center;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0;z-index:2}
header h1{font-size:17px;margin:0}header .mute{margin-left:auto}
nav{display:flex;gap:4px;padding:8px 20px;flex-wrap:wrap}nav button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 12px;border-radius:6px;cursor:pointer}
nav button.on{background:var(--a);color:#fff;border-color:var(--a)}
main{padding:4px 20px 30px;display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(380px,1fr))}
.card{min-width:0;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px}.card h2{font-size:14px;margin:0 0 10px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute)}
.wide{grid-column:1/-1}.mute{color:var(--mute)}.big{font-size:26px;font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.kpi{border:1px solid var(--line);border-radius:8px;padding:8px 10px}.kpi .v{font-size:20px;font-weight:600}
.bar{height:10px;background:var(--line);border-radius:5px;overflow:hidden}.bar>div{height:100%;background:var(--a)}
.pill{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;border:1px solid currentColor}
.FAIT,.ok{color:var(--ok)}.EN.COURS,.encours{color:var(--a)}.TODO{color:var(--mute)}.warn{color:var(--warn)}.bad{color:var(--bad)}
table{width:100%;border-collapse:collapse}td,th{padding:5px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{color:var(--mute);font-weight:500}
a{color:var(--a);cursor:pointer;text-decoration:none}a:hover{text-decoration:underline}
ul{margin:0;padding-left:18px}li{margin:3px 0}
#modal{position:fixed;inset:0;background:#0008;display:none;z-index:5}#modal .box{position:absolute;inset:4% 8%;background:var(--card);border-radius:10px;display:flex;flex-direction:column}
#modal .top{display:flex;padding:10px 16px;border-bottom:1px solid var(--line)}#modal .top b{flex:1}#modal .doc{overflow:auto;padding:16px 24px}
.doc pre{background:var(--bg);padding:8px;overflow:auto}.doc code{background:var(--bg);padding:0 3px}.doc table{margin:8px 0}
svg text{fill:var(--mute);font-size:11px}
.help{font-size:13px;color:var(--mute);margin:-4px 0 10px}
@media (max-width:640px){body{font-size:15px}header{flex-wrap:wrap;gap:6px 10px;padding:10px 12px}header .mute{margin-left:0;width:100%;font-size:12px}nav{flex-wrap:nowrap;overflow-x:auto;padding:8px 12px;position:sticky;top:0;background:var(--bg);z-index:1}nav button{flex:0 0 auto;padding:8px 12px}main{grid-template-columns:1fr;padding:4px 10px 24px;gap:10px}.card{padding:12px}.kpis{grid-template-columns:1fr 1fr}.kpi .v{font-size:18px}table{font-size:13px}td,th{overflow-wrap:anywhere}.scroll{overflow-x:auto}table:not(.grid),table:not(.grid) tbody{display:block}table:not(.grid) tr{display:block;border-bottom:1px solid var(--line);padding:6px 0}table:not(.grid) td,table:not(.grid) th{display:block;border:0;padding:1px 0}table:not(.grid) tr:has(th){display:none}.doc table:not(.grid) tr:first-child{font-weight:600}.grid td,.grid th{padding:4px 3px;overflow-wrap:normal}#modal .box{inset:0;border-radius:0}#modal .doc{padding:12px}}
</style>
</head>
<body>
<header><h1>creation_llm</h1><span id="phase" class="pill encours"></span><span class="mute" id="maj"></span></header>
<nav id="tabs"></nav>
<main id="main"></main>
<div id="modal"><div class="box"><div class="top"><b id="mtitle"></b><a onclick="closeDoc()">Fermer</a></div><div class="doc" id="mdoc"></div></div></div>
<script>
const STATIC=!!window.STATE;
function getDoc(p){return STATIC?Promise.resolve(window.DOCS?.[p]??null):fetch("/api/file?path="+encodeURIComponent(p)).then(r=>r.ok?r.text():null)}
const TABS=[["vue","Vue d'ensemble"],["roadmaps","Roadmaps"],["actions","Actions et journal"],["rd","Recherche et veille"],["resultats","Résultats"],["ameliorations","Améliorations"]];
let tab=location.hash.slice(1)||"vue",S=null;
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=(n,d=0)=>n==null?"—":Number(n).toLocaleString("fr-FR",{maximumFractionDigits:d,minimumFractionDigits:d});
const link=(p,t)=>`<a onclick="openDoc('${esc(p)}')">${esc(t||p)}</a>`;
const refs=t=>esc(t).replace(/`([^`]+\.(md|py|json|csv|txt))`/g,(m,p)=>`<a onclick="openDoc('${p}')"><code>${p}</code></a>`);
function nav(){$("#tabs").innerHTML=TABS.map(([k,l])=>`<button class="${k==tab?"on":""}" onclick="go('${k}')">${l}</button>`).join("")}
function go(k){tab=k;location.hash=k;nav();render()}
function chart(c,ref){if(!c.length)return"<p class=mute>Pas encore de point de validation.</p>";
 const W=760,H=230,P=40,all=c.concat(ref),xs=all.map(p=>p[0]),ys=all.map(p=>p[1]).filter(y=>y<5);
 const x0=0,x1=Math.max(...c.map(p=>p[0]))*1.05,y0=Math.min(...ys)-.05,y1=Math.min(Math.max(...ys),4.2);
 const X=x=>P+(x-x0)/(x1-x0)*(W-P-10),Y=y=>H-25-(Math.min(y,y1)-y0)/(y1-y0)*(H-35);
 const line=(pts,col)=>`<polyline fill="none" stroke="${col}" stroke-width="2" points="${pts.filter(p=>p[0]<=x1).map(p=>X(p[0])+","+Y(p[1])).join(" ")}"/>`;
 let g="";for(let i=0;i<=4;i++){const y=y0+(y1-y0)*i/4;g+=`<line x1="${P}" x2="${W-10}" y1="${Y(y)}" y2="${Y(y)}" stroke="var(--line)"/><text x="2" y="${Y(y)+4}">${y.toFixed(2)}</text>`}
 for(let i=0;i<=4;i++){const x=x1*i/4;g+=`<text x="${X(x)-14}" y="${H-6}">${fmt(x/1000)}k</text>`}
 return`<svg viewBox="0 0 ${W} ${H}" width="100%">${g}${line(ref,"var(--mute)")}${line(c,"var(--a)")}</svg><div class=mute><span style="color:var(--a)">━ 369M</span> &nbsp; ━ v9 (référence) — perte de validation par pas (plus bas = mieux)</div>`}
function vue(){const e=S.entrainement,g=S.gpu,j=S.jeton,cmp=e.comparaison_v9;
 const vram=g?g.used_mib/1024:null,vcls=vram==null?"":vram>7.5?"bad":vram>7?"warn":"ok";
 const run=e.etat.raison==="termine"?"<span class='pill ok'>terminé</span>":e.actif?"<span class='pill ok'>en cours</span>":"<span class='pill warn'>en pause / arrêté</span>";
 return`<section class="card wide"><h2>Pré-entraînement du modèle 369M ${run}</h2>
 <p class=help>Le modèle apprend le français sur ~7,4 milliards de tokens. Chaque « pas » traite 65 536 tokens. La perte mesure l'erreur de prédiction : elle doit baisser.</p>
 <div class=kpis><div class=kpi><div class=mute>Avancement</div><div class=v>${fmt(e.pct,1)} %</div><div class=mute>pas ${fmt(e.step)} / ${fmt(e.max_steps)}</div></div>
 <div class=kpi><div class=mute>Perte de validation</div><div class=v>${fmt(e.val,3)}</div><div class=mute>${cmp?`v9 au pas ${fmt(cmp[0])} : ${fmt(cmp[2],3)}`:""}</div></div>
 <div class=kpi><div class=mute>Rythme réel</div><div class=v>${e.rate_reel?fmt(e.rate_reel)+" pas/h":"mesure en cours"}</div><div class=mute>sans pause : ${fmt(e.rate_theorique)} pas/h (${fmt(e.tps)} tok/s)</div></div>
 <div class=kpi><div class=mute>Fin estimée</div><div class=v>${e.eta_jours!=null?fmt(e.eta_jours,1)+" j":"—"}</div><div class=mute>${e.rate_reel?"au rythme réel des dernières 24 h":"rythme réel mesuré après 30 min d'ouverture"}</div></div></div>
 <div class=bar style="margin:12px 0"><div style="width:${e.pct||0}%"></div></div>${chart(e.courbe,e.courbe_v9)}
 <p class=mute>Dernier log il y a ${fmt(e.log_age_s/60,0)} min · état écrit le ${esc(e.etat.date)} (${esc(e.etat.raison)})</p></section>
 <section class=card><h2>GPU et jeton</h2><p class=help>La carte (8 Go) est partagée entre plusieurs projets via un jeton géré par VertIA. Limite du protocole : 7,5 Go.</p>
 <table><tr><td>Détenteur du jeton</td><td><b>${esc(j?.holder||"aucun")}</b>${j?.expires?` <span class=mute>jusqu'au ${new Date(j.expires*1000).toLocaleString("fr-FR")}</span>`:""}</td></tr>
 <tr><td>VRAM utilisée (total carte)</td><td class=${vcls}>${g?fmt(vram,2)+" / "+fmt(g.total_mib/1024,1)+" Go":"indisponible"}</td></tr>
 <tr><td>Charge GPU</td><td>${g?fmt(g.util)+" % · "+fmt(g.temp)+" °C":"—"}</td></tr></table></section>
 <section class=card><h2>Où en est-on ?</h2><ul>${S.roadmaps.flatMap(r=>r.phases.filter(p=>p.statut=="EN COURS").map(p=>`<li><b>${esc(p.titre)}</b> — ${link(r.fichier)}</li>`)).join("")}</ul>
 <h2 style="margin-top:14px">Contexte (signals du ${esc(S.signals.maj)})</h2><ul>${S.signals.contexte.map(c=>`<li>${refs(c)}</li>`).join("")}</ul>
 <h2 style="margin-top:14px">Derniers événements</h2><ul>${S.journal.slice(0,6).map(l=>`<li><span class=mute>${esc(l.date)}</span> ${refs(l.texte)}</li>`).join("")||"<li class=mute>Journal vide (intégré au dernier /close)</li>"}</ul></section>
 <section class=card><h2>Dépôt git</h2><p class=mute>${S.git.non_commites??"?"} fichier(s) modifié(s) non commité(s)</p><table>${S.git.commits.map(c=>`<tr><td class=mute>${esc(c.date)}</td><td>${esc(c.message)}</td></tr>`).join("")}</table></section>`}
function roadmapsV(){return S.roadmaps.map(r=>`<section class=card><h2>${link(r.fichier,r.titre)}</h2><table>${r.phases.map(p=>`<tr><td>${esc(p.titre)}</td><td><span class="pill ${p.statut}">${p.statut}</span></td></tr>`).join("")}</table></section>`).join("")}
function actionsV(){const a=S.signals.actions;return`<section class="card wide"><h2>Actions ouvertes (signals du ${esc(S.signals.maj)})</h2><p class=help>Mises à jour à chaque /close. « Fait quand » = critère pour clore l'action.</p>
 <table><tr><th>Prio</th><th>Action</th><th>Fait quand</th><th>Références</th></tr>${a.map(x=>`<tr><td><span class="pill ${x.prio=="P1"?"bad":"warn"}">${x.prio}</span></td><td>${refs(x.texte)}</td><td class=mute>${refs(x.fait_quand)}</td><td>${refs(x.ref)}</td></tr>`).join("")}</table></section>
 <section class="card wide"><h2>Journal de la session en cours</h2><p class=help>Événements notés au fil de l'eau, intégrés puis vidés par /close.</p><table>${S.journal.map(l=>`<tr><td class=mute style="white-space:nowrap">${esc(l.date)}</td><td>${esc(l.type)}</td><td>${refs(l.texte)}</td></tr>`).join("")}</table></section>`}
function rdV(){const r=S.recherche,tc={"À INTÉGRER":"ok","À TESTER":"encours","À SURVEILLER":"warn","ÉCARTÉ":"bad"};
 return`<section class="card wide"><h2>Recherches sur tes sujets</h2><p class=help>Chaque sujet : un agent de recherche (rapport) puis un agent d'analyse (ce qui est adaptable au projet, verdict). Lancer : <code>sh rd/agents_codex/file.sh</code>.</p>
 <table><tr><th>Date</th><th>Sujet</th><th>Verdict</th><th>Documents</th></tr>${r.sujets.map(s=>`<tr><td class=mute>${esc(s.date)}</td><td>${esc(s.sujet)}</td><td><span class="pill ${tc[s.tag]||""}">${esc(s.tag||"?")}</span> <span class=mute>${esc(s.verdict.slice(s.tag.length).replace(/^\s*—\s*/,""))}</span></td><td>${link(s.dossier+"rapport.md","rapport")} · ${link(s.dossier+"analyse.md","analyse")}</td></tr>`).join("")}</table>
 <h2 style="margin-top:14px">File d'attente</h2>${r.file.length?`<ul>${r.file.map(f=>`<li>${esc(f)}</li>`).join("")}</ul>`:"<p class=mute>Vide</p>"}</section>
 <section class=card><h2>Veille d'actualité</h2><ul>${r.veilles.map(v=>`<li>${link(v.fichier,v.ligne)}</li>`).join("")||"<li class=mute>Aucune</li>"}</ul></section>
 <section class=card><h2>Documents R&D</h2><ul>${r.documents.map(d=>`<li>${link(d,d.replace("rd/",""))}</li>`).join("")}</ul></section>`}
function resultatsV(){const b=S.benchmarks;return`<section class="card wide"><h2>Benchmark assistant (300 cas)</h2><p class=help>Taux de réussite de l'assistant par version. Référence actuelle : v2.</p>
 <div class=scroll><table class=grid><tr><th>Version</th><th>Pas</th><th>Global</th>${Object.keys(b.assistant[0]?.categories||{}).map(k=>`<th>${esc(k)}</th>`).join("")}</tr>${b.assistant.map(x=>`<tr><td>${esc(x.tag)}</td><td class=mute>${fmt(x.pas)}</td><td><b>${fmt(100*x.taux,1)} %</b></td>${Object.values(x.categories).map(v=>`<td>${fmt(100*v,0)}</td>`).join("")}</tr>`).join("")}</table></div></section>
 <section class=card><h2>FrenchBench (0-shot)</h2><p class=help>Grammaire et vocabulaire : critères des gates des phases 3 et 4.</p><table class=grid><tr><th>Modèle</th><th>Grammaire</th><th>Vocabulaire</th></tr>${b.frenchbench.map(f=>`<tr><td>${esc(f.modele)}</td><td>${fmt(f.grammaire,1)}</td><td>${fmt(f.vocabulaire,1)}</td></tr>`).join("")}</table></section>`}
function amelV(){return`<section class="card wide"><div id=amel class=doc>Chargement…</div></section>`}
function render(){if(!S)return;const e=S.entrainement;$("#maj").textContent=STATIC?"Instantané du "+S.maintenant+" (publié depuis le tableau de bord local)":"Mis à jour "+S.maintenant+" · actualisation toutes les 20 s";
 $("#phase").textContent=`369M : ${fmt(e.pct,1)} %`;
 $("#main").innerHTML={vue,roadmaps:roadmapsV,actions:actionsV,rd:rdV,resultats:resultatsV,ameliorations:amelV}[tab]();
 if(tab=="ameliorations")getDoc("ameliorations.md").then(t=>$("#amel").innerHTML=t?md(t):"<p class=mute>Non disponible.</p>")}
function md(t){const lines=t.split(/\r?\n/);let h="",inT=false,inC=false,inL=false;
 const il=s=>esc(s).replace(/`([^`]+)`/g,(m,c)=>/\.(md|py|json|csv|txt)$/.test(c)&&!c.includes(" ")?`<a onclick="openDoc('${c}')"><code>${c}</code></a>`:`<code>${c}</code>`).replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>").replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g,'<a href="$2" target=_blank>$1</a>');
 for(const l of lines){if(l.startsWith("```")){h+=inC?"</pre>":"<pre>";inC=!inC;continue}if(inC){h+=esc(l)+"\n";continue}
  if(/^\|/.test(l)){if(/^\|\s*-/.test(l))continue;if(!inT){h+="<table>";inT=true}h+="<tr>"+l.slice(1,-1).split("|").map(c=>`<td>${il(c.trim())}</td>`).join("")+"</tr>";continue}else if(inT){h+="</table>";inT=false}
  if(/^\s*[-*] /.test(l)){if(!inL){h+="<ul>";inL=true}h+=`<li>${il(l.replace(/^\s*[-*] /,""))}</li>`;continue}else if(inL){h+="</ul>";inL=false}
  const m=l.match(/^(#{1,4}) (.*)/);if(m){h+=`<h${m[1].length+1}>${il(m[2])}</h${m[1].length+1}>`;continue}
  h+=l.trim()?`<p>${il(l)}</p>`:""}
 return h+(inT?"</table>":"")+(inL?"</ul>":"")}
function openDoc(p){getDoc(p).then(t=>{t=t??(STATIC?"Document non inclus dans cet instantané : ouvrir le tableau de bord local (python run.py).":"Fichier non disponible.");$("#mtitle").textContent=p;$("#mdoc").innerHTML=p.endsWith(".md")?md(t):`<pre>${esc(t)}</pre>`;$("#modal").style.display="block"})}
function closeDoc(){$("#modal").style.display="none"}
document.addEventListener("keydown",e=>e.key=="Escape"&&closeDoc());
async function load(){if(STATIC){S=window.STATE;render();return}try{S=await (await fetch("/api/state")).json();render()}catch(e){$("#maj").textContent="Serveur injoignable"}}
nav();load();if(!STATIC)setInterval(()=>{if($("#modal").style.display!="block")load()},20000);
window.addEventListener("hashchange",()=>{const k=location.hash.slice(1);if(k&&k!=tab&&TABS.some(t=>t[0]==k)){tab=k;nav();render()}});
</script>
</body>
</html>
